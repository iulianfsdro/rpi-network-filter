{{define "title"}}Devices{{end}}

{{define "content"}}
<div x-data="devicesApp()" x-init="load()">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <p style="margin:0; color:var(--pico-muted-color);">
            <span x-text="devices.filter(d => d.online).length"></span> online /
            <span x-text="devices.length"></span> total
        </p>
        <button class="outline btn-sm" @click="load()">Refresh</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Status</th>
                <th>Name</th>
                <th>MAC Address</th>
                <th>IP Address</th>
                <th>Policy</th>
                <th>Blocked</th>
                <th title="Off = traffic events from this device are dropped before they hit query_log. Firewall rules still apply.">Log</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <template x-for="d in devices" :key="d.mac_address">
                <tr>
                    <td>
                        <span x-show="d.online" class="badge badge-success">Online</span>
                        <span x-show="!d.online" class="badge badge-muted">Offline</span>
                    </td>
                    <td>
                        <strong x-text="d.alias || d.hostname || 'Unknown'"></strong>
                        <br x-show="d.alias && d.hostname">
                        <small x-show="d.alias && d.hostname" x-text="d.hostname" style="color:var(--pico-muted-color);"></small>
                    </td>
                    <td><code x-text="d.mac_address" style="font-size:0.85rem;"></code></td>
                    <td x-text="d.ip_address || '-'"></td>
                    <td>
                        <select :value="policyByMAC[d.mac_address.toLowerCase()] || ''"
                                @change="setPolicy(d, $event.target.value)"
                                style="padding:0.25rem 0.4rem; font-size:0.85rem; min-width:140px;">
                            <option value="">Default (inherited)</option>
                            <template x-for="p in policies" :key="p.id">
                                <option :value="p.id" x-text="p.name + (p.mode === 'strict' ? ' (strict)' : '')"></option>
                            </template>
                        </select>
                    </td>
                    <td>
                        <label class="toggle" @click.prevent="toggleBlock(d)">
                            <input type="checkbox" :checked="d.is_blocked">
                            <span class="toggle-slider"></span>
                        </label>
                    </td>
                    <td>
                        <label class="toggle" @click.prevent="toggleLog(d)"
                               :title="d.ignore_traffic_log ? 'Logging suppressed — flip on to resume logging' : 'Logging on — flip off to ignore this device and wipe its history'">
                            <input type="checkbox" :checked="!d.ignore_traffic_log">
                            <span class="toggle-slider"></span>
                        </label>
                    </td>
                    <td>
                        <button class="outline btn-sm" @click="editDevice(d)">Edit</button>
                    </td>
                </tr>
            </template>
        </tbody>
    </table>

    <dialog id="edit-dialog">
        <article>
            <header><h5 style="margin:0;">Edit Device</h5></header>
            <label>
                Alias
                <input type="text" x-model="editForm.alias" placeholder="e.g. My Phone">
            </label>
            <label>
                <input type="checkbox" x-model="editForm.is_blocked">
                Block all traffic
            </label>
            <label>
                <input type="checkbox" x-model="editForm.ignore_traffic_log">
                Ignore traffic logs
                <small style="display:block; color:var(--pico-muted-color);">
                    Drops events from the traffic monitor before insert (firewall rules unaffected).
                    Enabling wipes existing history for this device.
                </small>
            </label>
            <footer style="display:flex; gap:0.5rem; justify-content:flex-end;">
                <button class="outline secondary" @click="closeEdit()">Cancel</button>
                <button @click="saveDevice()">Save</button>
            </footer>
        </article>
    </dialog>
</div>
{{end}}

{{define "scripts"}}
<script>
function devicesApp() {
    // Builds the full PUT payload for /api/devices/{mac} so partial
    // updates (toggleBlock, toggleLog) don't accidentally clobber the
    // fields they don't touch — the backend reads every key on each call.
    function devicePayload(d) {
        return {
            alias: d.alias || '',
            is_blocked: !!d.is_blocked,
            ignore_traffic_log: !!d.ignore_traffic_log,
        };
    }

    return {
        devices: [],
        policies: [],
        policyByMAC: {}, // mac (lowercase) → policy_id
        editForm: { mac: '', alias: '', is_blocked: false, ignore_traffic_log: false },

        async load() {
            this.devices  = await api.get('/api/devices') || [];
            this.policies = await api.get('/api/policies') || [];
            const assignments = await api.get('/api/policies/assignments') || [];
            this.policyByMAC = {};
            for (const a of assignments) {
                this.policyByMAC[a.device_mac.toLowerCase()] = a.policy_id;
            }
        },
        async setPolicy(d, policyID) {
            const mac = d.mac_address;
            try {
                if (!policyID) {
                    await api.delete('/api/devices/' + encodeURIComponent(mac) + '/policy');
                    notify('Reverted ' + (d.alias || mac) + ' to Default', 'success');
                } else {
                    await api.put('/api/devices/' + encodeURIComponent(mac) + '/policy',
                                  { policy_id: Number(policyID) });
                    const p = this.policies.find(x => x.id == policyID);
                    notify((d.alias || mac) + ' → ' + (p ? p.name : policyID), 'success');
                }
                this.load();
            } catch(e) {}
        },
        async toggleBlock(d) {
            d.is_blocked = !d.is_blocked;
            try {
                await api.put('/api/devices/' + encodeURIComponent(d.mac_address), devicePayload(d));
                notify(d.is_blocked ? 'Device blocked' : 'Device unblocked', 'success');
            } catch(e) {
                d.is_blocked = !d.is_blocked;
            }
        },
        async toggleLog(d) {
            // The toggle in the table reflects "logging on", so flipping it
            // off corresponds to ignore_traffic_log = true. Confirm before
            // wiping history when turning logging off.
            const turningOff = !d.ignore_traffic_log;
            if (turningOff && !confirm(
                'Stop logging traffic from "' + (d.alias || d.hostname || d.mac_address) +
                '" and wipe its existing history from the traffic monitor?\n\n' +
                'Firewall rules will continue to apply unchanged.'
            )) {
                return;
            }
            d.ignore_traffic_log = !d.ignore_traffic_log;
            try {
                await api.put('/api/devices/' + encodeURIComponent(d.mac_address), devicePayload(d));
                notify(d.ignore_traffic_log ? 'Traffic logging suppressed; history wiped' : 'Traffic logging resumed', 'success');
            } catch(e) {
                d.ignore_traffic_log = !d.ignore_traffic_log;
            }
        },
        editDevice(d) {
            this.editForm = {
                mac: d.mac_address,
                alias: d.alias,
                is_blocked: d.is_blocked,
                ignore_traffic_log: !!d.ignore_traffic_log,
            };
            document.getElementById('edit-dialog').showModal();
        },
        closeEdit() {
            document.getElementById('edit-dialog').close();
        },
        async saveDevice() {
            await api.put('/api/devices/' + encodeURIComponent(this.editForm.mac), {
                alias: this.editForm.alias,
                is_blocked: this.editForm.is_blocked,
                ignore_traffic_log: this.editForm.ignore_traffic_log,
            });
            notify('Device updated', 'success');
            this.closeEdit();
            this.load();
        }
    };
}
</script>
{{end}}
