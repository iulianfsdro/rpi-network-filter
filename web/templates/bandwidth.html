{{define "title"}}Bandwidth Control{{end}}

{{define "content"}}
<div x-data="bandwidthApp()" x-init="load()">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <p style="margin:0; color:var(--pico-muted-color);">
            <span x-text="limits.length"></span> bandwidth limits configured
        </p>
        <button @click="showAdd = !showAdd">+ Add Limit</button>
    </div>

    <!-- Add limit form -->
    <article x-show="showAdd" x-transition>
        <header><h5 style="margin:0;">New Bandwidth Limit</h5></header>
        <div class="grid">
            <label>
                Device
                <select x-model="form.device_mac">
                    <option value="">-- Select device --</option>
                    <template x-for="d in devices" :key="d.mac_address">
                        <option :value="d.mac_address" x-text="(d.alias || d.hostname || d.mac_address) + ' (' + d.ip_address + ')'"></option>
                    </template>
                </select>
            </label>
        </div>
        <div class="grid">
            <label>
                Download Limit (Kbps)
                <input type="number" x-model.number="form.download_kbps" placeholder="e.g. 5000 = 5 Mbps">
                <small x-text="(form.download_kbps / 1000).toFixed(1) + ' Mbps'"></small>
            </label>
            <label>
                Upload Limit (Kbps)
                <input type="number" x-model.number="form.upload_kbps" placeholder="e.g. 2000 = 2 Mbps">
                <small x-text="(form.upload_kbps / 1000).toFixed(1) + ' Mbps'"></small>
            </label>
        </div>
        <footer>
            <button class="outline secondary" @click="showAdd = false">Cancel</button>
            <button @click="addLimit()">Save</button>
        </footer>
    </article>

    <!-- Limits table -->
    <table>
        <thead>
            <tr>
                <th>Device</th>
                <th>Download</th>
                <th>Upload</th>
                <th>Enabled</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <template x-for="l in limits" :key="l.id">
                <tr>
                    <td>
                        <code x-text="l.device_mac" style="font-size:0.85rem;"></code>
                        <template x-if="deviceName(l.device_mac)">
                            <br><small x-text="deviceName(l.device_mac)"></small>
                        </template>
                    </td>
                    <td x-text="(l.download_kbps / 1000).toFixed(1) + ' Mbps'"></td>
                    <td x-text="(l.upload_kbps / 1000).toFixed(1) + ' Mbps'"></td>
                    <td>
                        <label class="toggle" @click.prevent="toggleLimit(l)">
                            <input type="checkbox" :checked="l.enabled">
                            <span class="toggle-slider"></span>
                        </label>
                    </td>
                    <td>
                        <button class="outline btn-sm" style="color:var(--danger);" @click="deleteLimit(l.id)">Delete</button>
                    </td>
                </tr>
            </template>
        </tbody>
    </table>
    <p x-show="limits.length === 0" style="text-align:center; color:var(--pico-muted-color);">
        No bandwidth limits set. Devices with allowed firewall rules have unlimited bandwidth.
    </p>
</div>
{{end}}

{{define "scripts"}}
<script>
function bandwidthApp() {
    return {
        limits: [],
        devices: [],
        showAdd: false,
        form: { device_mac: '', download_kbps: 5000, upload_kbps: 2000, enabled: true },
        async load() {
            this.limits = await api.get('/api/bandwidth/limits');
            this.devices = await api.get('/api/devices');
        },
        deviceName(mac) {
            const d = this.devices.find(d => d.mac_address === mac);
            return d ? (d.alias || d.hostname || '') : '';
        },
        async addLimit() {
            if (!this.form.device_mac) { notify('Select a device', 'error'); return; }
            await api.post('/api/bandwidth/limits', this.form);
            notify('Bandwidth limit added', 'success');
            this.showAdd = false;
            this.form = { device_mac: '', download_kbps: 5000, upload_kbps: 2000, enabled: true };
            this.load();
        },
        async toggleLimit(l) {
            l.enabled = !l.enabled;
            try {
                await api.put('/api/bandwidth/limits/' + l.id, {
                    device_mac: l.device_mac,
                    download_kbps: l.download_kbps,
                    upload_kbps: l.upload_kbps,
                    enabled: l.enabled
                });
                notify(l.enabled ? 'Limit enabled' : 'Limit disabled', 'success');
            } catch(e) {
                l.enabled = !l.enabled;
            }
        },
        async deleteLimit(id) {
            if (!confirm('Remove this bandwidth limit?')) return;
            await api.delete('/api/bandwidth/limits/' + id);
            notify('Limit removed', 'success');
            this.load();
        }
    };
}
</script>
{{end}}
