{{define "title"}}DNS Blocking{{end}}

{{define "content"}}
<div x-data="dnsApp()" x-init="load()">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
        <p style="margin:0; color:var(--pico-muted-color);">
            <span x-text="entries.length"></span> domains in blocklist
        </p>
        <div class="btn-group">
            <button class="outline" @click="showImport = !showImport">Import List</button>
            <button @click="showAdd = !showAdd">+ Block Domain</button>
        </div>
    </div>

    <!-- Add single domain -->
    <article x-show="showAdd" x-transition>
        <header><h5 style="margin:0;">Block Domain</h5></header>
        <div class="grid">
            <label>
                Domain
                <input type="text" x-model="addForm.domain" placeholder="e.g. facebook.com">
            </label>
            <label>
                Category
                <input type="text" x-model="addForm.category" placeholder="e.g. social, ads, custom" value="custom">
            </label>
        </div>
        <footer>
            <button class="outline secondary" @click="showAdd = false">Cancel</button>
            <button @click="addDomain()">Block</button>
        </footer>
    </article>

    <!-- Bulk import -->
    <article x-show="showImport" x-transition>
        <header><h5 style="margin:0;">Import Blocklist</h5></header>
        <label>
            Paste domains (one per line, or hosts file format)
            <textarea x-model="importText" rows="8" placeholder="0.0.0.0 ads.example.com&#10;tracker.example.com&#10;# comments are ignored"></textarea>
        </label>
        <label>
            Category
            <input type="text" x-model="importCategory" value="imported">
        </label>
        <footer>
            <button class="outline secondary" @click="showImport = false">Cancel</button>
            <button @click="importDomains()" :aria-busy="importing">Import</button>
        </footer>
    </article>

    <!-- Search -->
    <input type="search" x-model="search" placeholder="Search domains..." style="margin-bottom:1rem;">

    <!-- Entries table -->
    <table>
        <thead>
            <tr>
                <th>Domain</th>
                <th>Category</th>
                <th>Enabled</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <template x-for="e in filtered" :key="e.id">
                <tr>
                    <td><code x-text="e.domain"></code></td>
                    <td><span class="badge badge-muted" x-text="e.category"></span></td>
                    <td>
                        <span x-show="e.enabled" class="badge badge-success">Active</span>
                        <span x-show="!e.enabled" class="badge badge-muted">Disabled</span>
                    </td>
                    <td>
                        <button class="outline btn-sm" style="color:var(--danger);" @click="deleteDomain(e.id)">Remove</button>
                    </td>
                </tr>
            </template>
        </tbody>
    </table>
    <p x-show="filtered.length === 0" style="text-align:center; color:var(--pico-muted-color);">
        <span x-show="search">No domains match your search.</span>
        <span x-show="!search">No blocked domains yet.</span>
    </p>
</div>
{{end}}

{{define "scripts"}}
<script>
function dnsApp() {
    return {
        entries: [],
        search: '',
        showAdd: false,
        showImport: false,
        importing: false,
        addForm: { domain: '', category: 'custom' },
        importText: '',
        importCategory: 'imported',
        get filtered() {
            if (!this.search) return this.entries;
            const s = this.search.toLowerCase();
            return this.entries.filter(e => e.domain.includes(s) || e.category.includes(s));
        },
        async load() {
            this.entries = await api.get('/api/dns/blocklist');
        },
        async addDomain() {
            await api.post('/api/dns/blocklist', this.addForm);
            notify('Domain blocked', 'success');
            this.showAdd = false;
            this.addForm = { domain: '', category: 'custom' };
            this.load();
        },
        async deleteDomain(id) {
            await api.delete('/api/dns/blocklist/' + id);
            notify('Domain removed', 'success');
            this.load();
        },
        async importDomains() {
            this.importing = true;
            try {
                const result = await api.post('/api/dns/blocklist/import', {
                    text: this.importText,
                    category: this.importCategory
                });
                notify('Imported ' + result.imported + ' domains', 'success');
                this.showImport = false;
                this.importText = '';
                this.load();
            } finally {
                this.importing = false;
            }
        }
    };
}
</script>
{{end}}
