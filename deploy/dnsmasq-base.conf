# NetFilter dnsmasq configuration
# DHCP + DNS for hotspot clients on wlan0

interface=wlan0
bind-interfaces

# DHCP range
dhcp-range=192.168.4.100,192.168.4.250,24h

# DNS upstream (overridden by netfilterd via settings)
server=1.1.1.1
server=8.8.8.8

# Include blocklist generated by netfilterd
conf-dir=/etc/dnsmasq.d/,*.conf

# Logging — write to syslog (which systemd captures in journald)
log-queries
